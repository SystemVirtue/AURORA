name: AURORA CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q

  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install
      - run: npx supabase --version
      - run: npx supabase start
      - run: npx supabase db reset
      - run: pip install -e .
      - run: python scripts/test-reincarnation.py
      - run: pip install 'httpx>=0.28,<1'
      - run: python scripts/test-api-quorum.py
      - run: python scripts/benchmark-quorum.py
