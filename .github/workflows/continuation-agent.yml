name: AURORA MVP Continuation Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  actions: read
  issues: write

concurrency:
  group: aurora-mvp-continuation
  cancel-in-progress: false

jobs:
  continuation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Check MVP stop condition
        id: state
        run: |
          if grep -q '^status: MVP_ACHIEVED' .aurora/continuation-state.md 2>/dev/null; then echo "stop=true" >> "$GITHUB_OUTPUT"; else echo "stop=false" >> "$GITHUB_OUTPUT"; fi
      - name: Prepare continuation handoff
        if: steps.state.outputs.stop != 'true'
        run: |
          cat > .aurora/NEXT_AGENT_TASK.md <<'EOF'
          # AURORA MVP Continuation Task

          Standing instruction: **Proceed as recommended.**

          Work only toward AURORA MVP. Inspect the continuation state, architecture, implementation status, current CI, recent commits, and failing tests. Select the highest-value remaining MVP task, implement it, test it, and preserve security, provenance, tenancy isolation, and evidence discipline. Do not expand scope beyond MVP. Stop and mark `status: MVP_ACHIEVED` once all MVP acceptance criteria are demonstrably satisfied.
          EOF
          git status --short
      - name: Agent credential gate
        if: steps.state.outputs.stop != 'true'
        env:
          AURORA_AGENT_API_KEY: ${{ secrets.AURORA_AGENT_API_KEY }}
        run: |
          if [ -z "$AURORA_AGENT_API_KEY" ]; then echo 'No autonomous agent credential configured; continuation handoff is prepared but AI execution is paused.'; exit 0; fi
          echo 'Approved agent credential detected. An agent runner must be connected here to perform autonomous implementation.'
      - name: Confirm MVP stop state
        if: steps.state.outputs.stop == 'true'
        run: echo 'MVP_ACHIEVED — autonomous continuation is stopped.'
