name: AURORA Continuation State

on:
  workflow_run:
    workflows: ["AURORA CI"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  update-continuation-state:
    if: ${{ github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Update continuation state
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          mkdir -p .aurora
          if [ "$CONCLUSION" = "success" ]; then
            STATUS="CI_GREEN"
          else
            STATUS="CI_ACTION_REQUIRED"
          fi
          cat > .aurora/continuation-state.md <<EOF
# AURORA Continuation State

status: $STATUS
ci_run_id: $RUN_ID
ci_head_sha: $SHA
standing_instruction: Proceed as recommended.
scope: STOP at MVP achievement.

The next continuation agent must inspect the current repository, CI result, MVP architecture, and implementation status, then execute the highest-value remaining MVP task. It must not expand scope beyond MVP.
EOF

      - name: Commit continuation state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .aurora/continuation-state.md
          git diff --cached --quiet || git commit -m "chore: update AURORA continuation state"
          git push
